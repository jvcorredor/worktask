version: 2

project_name: worktask

before:
  hooks:
    - go mod tidy

builds:
  - id: worktask
    main: .
    binary: worktask
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jvcorredor/worktask/internal/version.Version={{ .Version }}
      - -X github.com/jvcorredor/worktask/internal/version.Commit={{ .FullCommit }}
      - -X github.com/jvcorredor/worktask/internal/version.Date={{ .Date }}

archives:
  - id: worktask
    ids:
      - worktask
    formats: [tar.gz]
    name_template: worktask_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  draft: false
  prerelease: auto

changelog:
  disable: true
