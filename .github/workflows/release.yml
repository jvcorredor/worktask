name: Release

on:
  push:
    branches:
      - main

# One release at a time. cancel-in-progress: false so an in-flight
# upload is queued behind, not aborted mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      # semantic-release reads conventional commits since the last
      # tag, computes the next version, creates the GitHub release +
      # tag via the API, then invokes goreleaser as a hook to build,
      # archive, and upload binaries onto that release in the same
      # checkout. allow-initial-development-versions keeps the
      # project on the 0.x track and treats breaking changes as
      # minor bumps until a 1.0.0 release exists; once it does, the
      # flag is silently ignored and breaking changes resume bumping
      # major. The action wrapper catches exit code 65 (no release)
      # and returns early, so chore-only pushes produce a green
      # workflow with no new tag. Do NOT pass --allow-no-changes;
      # it turns the exit code into 0, which makes the action try
      # to read the generated changelog file that was never written.
      - name: Run semantic-release
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          allow-initial-development-versions: true
          hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post-release guard: if a release was actually cut, fetch the live
  # install script the same way a real user would, run it, and assert
  # the resulting binary reports the tag we just published. Any
  # failure - download error, checksum mismatch, missing binary,
  # version mismatch - fails the workflow run loudly. Linux x86_64
  # only by deliberate design (see #28); macOS and arm64 runners are
  # out of scope for this smoke job.
  smoke-test:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install btw via published install script
        run: |
          curl -fsSL https://jvcorredor.github.io/bytheway/install.sh | sh
          printf '%s/.local/bin\n' "$HOME" >>"$GITHUB_PATH"

      - name: Assert installed binary reports the released version
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: sh .github/scripts/smoke-test-version.sh
