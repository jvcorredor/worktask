name: Go

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
